<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Museum</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <!-- Start Screen -->
    <div id="start-screen">
      <h1>Virtual Museum</h1>
      <p>Select an exhibition layout to begin.</p>
      <div class="button-group">
        <button id="btn-classical">Classical Wing</button>
        <button id="btn-modern">Modern Gallery</button>
        <button id="btn-maze">Exhibition Maze</button>
      </div>
    </div>

    <!-- WebGL Container -->
    <div id="app" style="display: none;"></div>

    <!-- 2D Minimap -->
    <canvas id="minimap" width="200" height="200" style="display: none;"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer" style="display: none;">
        
        <div id="hud">
            <p><b>WASD / Arrows:</b> Move</p>
            <p><b>Left Click:</b> Inspect Art</p>
            <p><b>ESC:</b> Exit to Menu</p>
        </div>

        <div id="greeting-toast" style="display: none;">
            Hello!
        </div>

        <!-- Artwork Info Popup (Centered Two-Column Modal) -->
        <div id="art-info" style="display: none;">
            <div id="modal-content-wrapper">
                <!-- Left Side: Image with Zoom & Pan -->
                <div id="art-image-container">
                    <img id="art-detail-image" src="" alt="Artwork Detail" />
                </div>
                
                <!-- Right Side: Details & Info -->
                <div id="art-details-container">
                    <h2 id="art-title">Artwork Title</h2>
                    <h4 id="art-artist">Artist Name, Year</h4>
                    <p id="art-desc">A beautiful exhibition piece on display in the virtual gallery.</p>
                    <p class="close-hint">Scroll to pan. Shift + Scroll to zoom.<br>Click outside to close.</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
