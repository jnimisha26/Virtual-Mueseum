<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Virtual Museum</title>
  </head>
  <body>
    <!-- Start Screen UI -->
    <div id="start-screen">
      <h1>Interactive Virtual Museum</h1>
      <p>Select an architectural layout to enter:</p>
      <div class="button-group">
        <button id="btn-classical">Classical Wing</button>
        <button id="btn-modern">Modern Gallery</button>
        <button id="btn-maze">Exhibition Maze</button>
      </div>
    </div>
    
    <!-- Minimap (Hidden until loaded) -->
    <canvas id="minimap" width="180" height="180" style="position: absolute; bottom: 20px; right: 20px; z-index: 5; border: 2px solid #fff; border-radius: 5px; background: rgba(0,0,0,0.7); display: none;"></canvas>

    <!-- 3D Canvas Container -->
    <div id="app"></div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
